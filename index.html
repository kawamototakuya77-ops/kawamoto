        function getDynamicPredictions(racers) {
            const courseBias = {
                1: 0.55,
                2: 0.15,
                3: 0.12,
                4: 0.10,
                5: 0.05,
                6: 0.03
            };
            
            // Calculate raw scores based on course bias and racer win rate
            let scores = {};
            let sumScores = 0;
            for (let b = 1; b <= 6; b++) {
                const racer = racers.find(r => r.lane === b);
                const rate = racer ? (parseFloat(racer.rate) || 5.00) : 5.00;
                scores[b] = courseBias[b] * rate;
                sumScores += scores[b];
            }
            
            // Normalize to win rates
            let winRates = {};
            for (let b = 1; b <= 6; b++) {
                winRates[b] = scores[b] / sumScores;
            }
            
            // Run Harville formula for 3-騾｣蜊・combinations
            let combos = [];
            for (let i = 1; i <= 6; i++) {
                const p1 = winRates[i];
                for (let j = 1; j <= 6; j++) {
                    if (i === j) continue;
                    const p2 = winRates[j] / (1.0 - p1);
                    for (let k = 1; k <= 6; k++) {
                        if (i === k || j === k) continue;
                        const p3 = winRates[k] / (1.0 - p1 - winRates[j]);
                        
                        const prob = p1 * p2 * p3;
                        combos.push({
                            combo: `${i}-${j}-${k}`,
                            prob: prob
                        });
                    }
                }
            }
            
            // Sort by probability descending
            combos.sort((a, b) => b.prob - a.prob);
            return combos;
        }

        function get4Focus(pred) {
            if (!pred || !pred.ai) return [];
            let finalFocus = [];
            const ai = pred.ai;
            if (ai.solid_focus && ai.solid_focus.length > 0 && ai.solid_focus[0] !== "-") {
                finalFocus = ai.solid_focus.filter(f => f && f !== "-" && /^[1-6](-|=|>|筐・[1-6](-|=|>|筐・[1-6]/.test(f));
            } else if (ai.focus && ai.focus.length > 0 && ai.focus[0] !== "-") {
                finalFocus = ai.focus.filter(f => f && f !== "-" && /^[1-6](-|=|>|筐・[1-6](-|=|>|筐・[1-6]/.test(f));
            }
            
            // 4騾壹ｊ縺ｫ貅縺溘↑縺・�ｴ蜷医・陬懷ｮ後↓縲∝・襍ｰ繝｡繝ｳ繝舌・縺ｮ蜍晉紫繧貞渚譏�縺励◆蜍慕噪莠域ｸｬ繧剃ｽｿ逕ｨ縺吶ｋ・・
            if (finalFocus.length < 4 && pred.data && pred.data.length >= 6) {
                const dynamicCombos = getDynamicPredictions(pred.data);
                for (let i = 0; i < dynamicCombos.length; i++) {
                    const candidate = dynamicCombos[i].combo;
                    if (!finalFocus.includes(candidate)) {
                        finalFocus.push(candidate);
                    }
                    if (finalFocus.length >= 4) break;
                }
            }
            
            while (finalFocus.length < 4) {
                finalFocus.push("1-2-3");
            }
            return finalFocus.slice(0, 4);
        }

        function calculateTodayStats() {
            let totalSolidBet = 0;
            let totalSolidPayout = 0;
            let solidHitCount = 0;

            let totalUpsetBet = 0;
            let totalUpsetPayout = 0;
            let upsetHitCount = 0;

            let finishedCount = 0;
            const historyList = [];

            for (const key in window.predictionsCache) {
                const pred = window.predictionsCache[key];
                if (!pred || !pred.success || !pred.ai) continue;

                if (pred.result && pred.result.success) {
                    const resultCombo = pred.result.combo;
                    const payout = pred.result.payout || 0;

                    // Get Solid Focus
                    let solidFocus = [];
                    if (pred.ai.solid_focus && Array.isArray(pred.ai.solid_focus)) {
                        solidFocus = pred.ai.solid_focus.filter(f => f && f !== "-");
                    }
                    if (solidFocus.length < 4) {
                        solidFocus = get4Focus(pred);
                    }
                    solidFocus = solidFocus.slice(0, 4);

                    // Get Upset Focus
                    let upsetFocus = [];
                    if (pred.ai.upset_focus && Array.isArray(pred.ai.upset_focus)) {
                        upsetFocus = pred.ai.upset_focus.filter(f => f && f !== "-");
                    }
                    if (upsetFocus.length < 4) {
                        if (pred.data && pred.data.length >= 6) {
                            const dynamicCombos = getDynamicPredictions(pred.data);
                            upsetFocus = [];
                            for (let i = 0; i < dynamicCombos.length; i++) {
                                const combo = dynamicCombos[i].combo;
                                if (!combo.startsWith("1-")) {
                                    upsetFocus.push(combo);
                                }
                                if (upsetFocus.length >= 4) break;
                            }
                        }
                        while (upsetFocus.length < 4) {
                            upsetFocus.push("2-1-3");
                        }
                    }
                    upsetFocus = upsetFocus.slice(0, 4);

                    if (solidFocus.length === 0 && upsetFocus.length === 0) continue;

                    finishedCount++;

                    // Solid calcs
                    const sBetCount = solidFocus.length;
                    const sBetAmount = sBetCount * 100;
                    totalSolidBet += sBetAmount;
                    const isSolidHit = solidFocus.includes(resultCombo);
                    let sPayout = 0;
                    if (isSolidHit) {
                        solidHitCount++;
                        sPayout = payout;
                        totalSolidPayout += payout;
                    }

                    // Upset calcs
                    const uBetCount = upsetFocus.length;
                    const uBetAmount = uBetCount * 100;
                    totalUpsetBet += uBetAmount;
                    const isUpsetHit = upsetFocus.includes(resultCombo);
                    let uPayout = 0;
                    if (isUpsetHit) {
                        upsetHitCount++;
                        uPayout = payout;
                        totalUpsetPayout += payout;
                    }

                    const parts = key.split("_");
                    const jcd = parts[0];
                    const rno = parts[1];
                    const venueName = ALL_24_VENUES[jcd] || jcd;

                    historyList.push({
                        key: key,
                        venue: venueName,
                        rno: rno,
                        combo: resultCombo,
                        payout: payout,
                        isHit: isSolidHit || isUpsetHit,
                        betCount: sBetCount + uBetCount,
                        netProfit: (sPayout + uPayout) - (sBetAmount + uBetAmount)
                    });
                }
            }

            const statsCard = document.getElementById('today-stats-card');
            const progressBadge = document.getElementById('stats-progress-badge');
            
            const solidRecoveryEl = document.getElementById('stats-solid-recovery');
            const solidHitEl = document.getElementById('stats-solid-hit');
            const upsetRecoveryEl = document.getElementById('stats-upset-recovery');
            const upsetHitEl = document.getElementById('stats-upset-hit');
            
            const netProfitEl = document.getElementById('stats-net-profit');
            const historyContainer = document.getElementById('history-list-container');

            if (finishedCount > 0) {
                if (statsCard) statsCard.classList.remove('hidden');
                if (progressBadge) {
                    progressBadge.innerText = `${finishedCount} 繝ｬ繝ｼ繧ｹ遒ｺ螳啻;
                }
                
                // Solid metrics
                const solidRecovery = totalSolidBet > 0 ? Math.round((totalSolidPayout / totalSolidBet) * 100) : 0;
                const solidHit = Math.round((solidHitCount / finishedCount) * 100);
                
                if (solidRecoveryEl) {
                    if (solidRecovery >= 100) {
                        solidRecoveryEl.className = "text-xs font-black font-outfit text-emerald-400";
                    } else if (solidRecovery >= 70) {
                        solidRecoveryEl.className = "text-xs font-black font-outfit text-amber-400";
                    } else {
                        solidRecoveryEl.className = "text-xs font-black font-outfit text-rose-400";
                    }
                    solidRecoveryEl.innerText = `${solidRecovery}%`;
                }
                if (solidHitEl) {
                    solidHitEl.className = "text-xs font-black font-outfit text-slate-200";
                    solidHitEl.innerText = `${solidHit}%`;
                }

                // Upset metrics
                const upsetRecovery = totalUpsetBet > 0 ? Math.round((totalUpsetPayout / totalUpsetBet) * 100) : 0;
                const upsetHit = Math.round((upsetHitCount / finishedCount) * 100);
                
                if (upsetRecoveryEl) {
                    if (upsetRecovery >= 100) {
                        upsetRecoveryEl.className = "text-xs font-black font-outfit text-emerald-400";
                    } else if (upsetRecovery >= 70) {
                        upsetRecoveryEl.className = "text-xs font-black font-outfit text-amber-400";
                    } else {
                        upsetRecoveryEl.className = "text-xs font-black font-outfit text-rose-400";
                    }
                    upsetRecoveryEl.innerText = `${upsetRecovery}%`;
                }
                if (upsetHitEl) {
                    upsetHitEl.className = "text-xs font-black font-outfit text-slate-200";
                    upsetHitEl.innerText = `${upsetHit}%`;
                }

                const netProfit = (totalSolidPayout + totalUpsetPayout) - (totalSolidBet + totalUpsetBet);

                if (netProfit > 0) {
                    netProfitEl.className = "font-black font-outfit text-emerald-400";
                    netProfitEl.innerText = `+${netProfit.toLocaleString()}蜀・;
                } else if (netProfit < 0) {
                    netProfitEl.className = "font-black font-outfit text-rose-400";
                    netProfitEl.innerText = `${netProfit.toLocaleString()}蜀・;
                } else {
                    netProfitEl.className = "font-black font-outfit text-slate-300";
                    netProfitEl.innerText = "ﾂｱ0蜀・;
                }

                // Sort history by JCD and RNO
                historyList.sort((a, b) => {
                    const aParts = a.key.split("_");
                    const bParts = b.key.split("_");
                    if (aParts[0] !== bParts[0]) {
                        return aParts[0].localeCompare(bParts[0]);
                    }
                    return parseInt(aParts[1]) - parseInt(bParts[1]);
                });

                historyContainer.innerHTML = '';
                historyList.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between p-1.5 rounded-lg bg-slate-950/40 text-[10px] border border-white/5 hover:bg-slate-900/40 cursor-pointer transition-colors";
                    row.addEventListener('click', () => {
                        const parts = item.key.split("_");
                        const targetJcd = parts[0];
                        const targetRno = parts[1];
                        
                        selectVenue(targetJcd);
                        
                        setTimeout(() => {
                            RNO_SELECT.value = targetRno;
                            window.currentRno = targetRno;
                            loadDataLocal();
                        }, 50);
                    });

                    const leftDiv = document.createElement('div');
                    leftDiv.className = "flex items-center gap-1.5";
                    
                    const badge = document.createElement('span');
                    if (item.isHit) {
                        badge.className = "px-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 font-black text-[8px]";
                        badge.innerText = "逧・ｸｭ";
                    } else {
                        badge.className = "px-1 rounded bg-slate-800 text-slate-400 border border-slate-700/50 text-[8px]";
                        badge.innerText = "荳咲噪荳ｭ";
                    }

                    const label = document.createElement('span');
                    label.className = "font-bold text-slate-300";
                    label.innerText = `${item.venue} ${item.rno}R`;

                    leftDiv.appendChild(badge);
                    leftDiv.appendChild(label);

                    const rightDiv = document.createElement('div');
                    rightDiv.className = "font-mono flex items-center gap-2";
                    
                    const payoutText = item.isHit ? `<span class="text-emerald-400 font-bold">${item.combo} (${item.payout.toLocaleString()}蜀・</span>` : `<span class="text-slate-500">${item.combo}</span>`;
                    const profitText = item.netProfit > 0 ? `<span class="text-emerald-400 font-bold">+${item.netProfit}</span>` : `<span class="text-rose-400">${item.netProfit}</span>`;
                    
                    rightDiv.innerHTML = `${payoutText} ${profitText}`;

                    row.appendChild(leftDiv);
                    rightDiv.className = "font-mono flex items-center gap-2";
                    row.appendChild(rightDiv);
                    historyContainer.appendChild(row);
                });
            } else {
                statsCard.classList.add('hidden');
            }
        }

        function createPremiumFocusElement(focusStr) {
            const container = document.createElement('div');
            container.className = 'flex items-center gap-1';
            
            const tokens = [];
            let currentToken = '';
            
            for (let char of focusStr) {
                if (char === '-' || char === '=' || char === '筐・ || char === '>') {
                    if (currentToken) {
                        tokens.push(currentToken);
                        currentToken = '';
                    }
                    tokens.push(char);
                } else {
                    currentToken += char;
                }
            }
            if (currentToken) {
                tokens.push(currentToken);
            }
            
            tokens.forEach(token => {
                if (['-', '=', '筐・, '>'].includes(token)) {
                    const arrow = document.createElement('span');
                    arrow.className = 'text-[9px] font-black text-slate-500 font-mono mx-0.5';
                    arrow.innerText = token === '=' ? '竍・ : '筐・;
                    container.appendChild(arrow);
                } else {
                    const nums = token.replace(/[^1-6]/g, '').split('');
                    
                    if (nums.length > 1) {
                        const multiBox = document.createElement('div');
                        multiBox.className = 'flex items-center gap-0.5 bg-slate-900/80 px-1 py-0.5 rounded-lg border border-white/5';
                        nums.forEach((num, idx) => {
                            const badge = createBoatBadge(num, 'w-4 h-4 text-[9px]');
                            multiBox.appendChild(badge);
                            if (idx < nums.length - 1) {
                                const slash = document.createElement('span');
                                slash.className = 'text-[8px] text-slate-600 font-bold';
                                slash.innerText = '/';
                                multiBox.appendChild(slash);
                            }
                        });
                        container.appendChild(multiBox);
                    } else if (nums.length === 1) {
                        const badge = createBoatBadge(nums[0], 'w-5 h-5 text-[10px]');
                        container.appendChild(badge);
                    } else {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'text-xs font-black text-slate-300';
                        textSpan.innerText = token;
                        container.appendChild(textSpan);

                fullOrder = [...predictedNums];
                for (let b = 1; b <= 6; b++) {
                    if (!fullOrder.includes(b)) {
                        fullOrder.push(b);
                    }
                }
                rankMap = {};
                fullOrder.forEach((lane, idx) => {
                    rankMap[lane] = idx + 1;
                });
                winnerLane = fullOrder[0];
                tacticLabel = getTacticLabel(winnerLane);

            setSimulationCombo(currentCombo);

            function initRacerPositions() {
                simRacers = racers.map(r => {
                    const laneNum = parseInt(r.lane) || 1;
                    const rank = rankMap[laneNum] || 6;
                    
                    let stVal = 0.15;
                    let isFlying = false;
                    if (r.st_val && r.st_val !== "N/A" && r.st_val !== "") {
                        const clean = r.st_val.replace('F', '');
                        stVal = parseFloat(clean) || 0.15;
                        if (r.st_val.includes('F')) {
                            isFlying = true;
                            stVal = -stVal;
                        }
                    }

                    const course = parseInt(r.st_course) || laneNum;
                    const exTime = parseFloat(r.ex_time) || 6.80;
                    const rate = parseFloat(r.rate) || 5.00;

                    // Speed parameters based on rank and exTime
                    let straightSpeed = 2.3 + (rate * 0.02) - (exTime - 6.70) * 0.8;
                    
                    // 縺ｾ縺上ｊ蜍昴■縺ｯ逶ｴ邱壹〒荳豌励↓莨ｸ縺ｳ縺ｦ縺上ｋ・・
                    if (rank === 1) {
                        if (winnerLane >= 3) {
                            straightSpeed += 0.35; // 縺ｾ縺上ｊ濶・・逶ｴ邱壻ｼｸ縺ｳ
                        } else {
                            straightSpeed += 0.08; // 騾壼ｸｸ
                        }
                    }

                    const baseRadius = 16 + (course - 1) * 9.5; 
                    let radius = baseRadius;
                    if (laneNum === winnerLane) {
                        if (winnerLane === 1) {
                            radius = baseRadius - 3.0; // 騾・￡縺ｮ繧､繝ｳ蟆丞屓繧・
                        } else if (winnerLane === 2) {
                            radius = baseRadius - 2.5; // 蟾ｮ縺励・蟆丞屓繧・
                        } else {
                            radius = baseRadius + 1.0; // 縺ｾ縺上ｊ縺ｯ螟悶ｒ蝗槭ｋ
                        }
                    } else if (rank >= 5) {
                        radius = baseRadius + 3.0; // 荳倶ｽ崎援縺ｯ螟悶↓豬√ｌ繧・
                    }

                    const turnSpeed = straightSpeed * (0.80 - (rank - 1) * 0.05);
                    const exitSpeed = 1.6 + (6 - rank) * 0.4;
                    const stOffset = (0.15 - stVal) * 110; 

                    return {
                        lane: laneNum,
                        name: r.name,
                        course: course,
                        rank: rank,
                        st: stVal,
                        isFlying: isFlying,
                        exTime: exTime,
                        rate: rate,
                        baseRadius: baseRadius,
                        radius: radius,
                        straightSpeed: straightSpeed,
                        turnSpeed: turnSpeed,
                        exitSpeed: exitSpeed,
                        x: 40 + stOffset - (course * 5),
                        y: 96 + baseRadius,
                        angle: 0,
                        phi: Math.PI * 0.5,
                        phase: 1,
                        speed: straightSpeed
                    };
                });
            }

            function updatePhysics() {
                const markX = viewWidth - 110;
                const markY = 96;

                simRacers.forEach(sr => {
                    const laneNum = parseInt(sr.lane) || 1;
                    if (sr.phase === 1) {
                        const targetSpeed = sr.straightSpeed;
                        sr.speed += (targetSpeed - sr.speed) * 0.08;
                        sr.x += sr.speed;
                        sr.angle = 0;

                        if (sr.x >= markX) {
                            sr.phase = 2;
                            sr.phi = Math.PI * 0.5;
                        }
                    } 
                    else if (sr.phase === 2) {
                        const turnProgress = (Math.PI * 0.5 - sr.phi) / Math.PI;
                        
                        if (winnerLane >= 2 && winnerLane <= 3 && laneNum === 1) {
                            sr.radius = sr.baseRadius + 14.0 * Math.sin(turnProgress * Math.PI);
                        }
                        
                        if (winnerLane >= 3 && laneNum < winnerLane && turnProgress > 0.2 && turnProgress < 0.8) {
                            sr.speed *= 0.95;
                        }

                        const speedFactor = 1.0 - 0.40 * Math.sin(turnProgress * Math.PI);
                        let targetSpeed = sr.turnSpeed * speedFactor;
                        
                        if (laneNum === winnerLane && winnerLane >= 3) {
                            targetSpeed *= 1.15;
                        }
                        
                        sr.speed += (targetSpeed - sr.speed) * 0.10;

                        const dPhi = sr.speed / sr.radius;
                        sr.phi -= dPhi;

                        sr.x = markX + sr.radius * Math.cos(sr.phi);
                        sr.y = markY + sr.radius * Math.sin(sr.phi);
                        
                        sr.angle = sr.phi - Math.PI * 0.5;

                        if (sr.phi <= -Math.PI * 0.5) {
                            sr.phase = 3;
                            sr.y = markY - sr.radius;
                        }
                    } 
                    else if (sr.phase === 3) {
                        const targetSpeed = sr.exitSpeed;
                        sr.speed += (targetSpeed - sr.speed) * 0.08;
                        sr.x -= sr.speed;
                        sr.angle = Math.PI;
                    }
                });
            }
